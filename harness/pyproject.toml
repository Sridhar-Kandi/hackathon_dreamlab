[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dream-harness"
version = "0.1.0"
description = "Spotter harness modules around Dream-1 on the Dream YAM MuJoCo simulator"
requires-python = ">=3.10"
dependencies = ["numpy", "mujoco>=3.3.5,<4"]

[tool.setuptools.packages.find]
where = ["src"]
